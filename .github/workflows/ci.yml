name: CI

# develop/main 대상 PR과 push에서 Gradle build를 실행한다.
# 현재 테스트는 application-test.yml의 H2 인메모리 DB를 사용한다.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# 같은 ref에 새 푸시가 오면 진행 중인 실행을 취소해 러너 낭비를 줄인다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest

    steps:
      - name: 체크아웃
        uses: actions/checkout@v6

      - name: JDK 21 설치
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v6

      - name: 빌드 및 테스트
        run: ./gradlew build --no-daemon

      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore
